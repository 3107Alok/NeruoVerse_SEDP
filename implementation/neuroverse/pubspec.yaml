name: neuroverse_app
description: "A cognitive health and training app for the elderly."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^22.3.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  uuid: ^4.6.0
  intl: ^0.20.3
  timezone: ^0.11.1
  audioplayers: ^6.1.2
  image_picker: ^1.2.3
  geolocator: ^14.0.1
  url_launcher: ^6.3.3
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#000B09"
  adaptive_icon_foreground: "assets/images/app_icon.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/memory_cards/
    - assets/audio/voice/hi/
    - assets/audio/voice/en/
    - assets/audio/voice/bn/
    - assets/audio/voice/as/
    - assets/audio/voice/mni/
    - assets/audio/voice/miz/
